"en":"Thurstone & Chave Attitude Toward the Church Scale"},{"title":"طريقة ليكرت (1): مقياس روزنبرج لتقدير الذات (1965)","en":"Rosenberg Self-Esteem Scale"},{"title":"طريقة ليكرت (2): مقياس الاتجاه نحو المعوقين (يوكر وبلوك وكامبل، 1960)","en":"Attitude Toward Disabled Persons (ATDP)"},{"title":"طريقة جتمان (1): مقياس بوجاردس للبعد الاجتماعي (1925)","en":"Bogardus Social Distance Scale"},{"title":"طريقة جتمان (2): مقياس الاتجاه نحو تعليم البنت","en":"Guttman Cumulative Scale Example"},{"title":"التمايز الدلالي (أوسجود وسوسي وتاننباوم، 1957)","en":"Semantic Differential"},{"title":"الاختيار القسري: دراسة القيم (ألبورت وفيرنون وليندزي)","en":"Study of Values — Forced Choice"},{"title":"نموذج راش ونظرية الاستجابة للمفردة والاختبار التكيفي","en":"Rasch, IRT and CAT"},{"title":"الحكم الموقفي والتوليد بالذكاء الاصطناعي","en":"SJT and AI Item Generation"},{"title":"جدول جامع: لكل عالم مقياس أو تطبيق حقيقي","en":"Scholars and Real Instruments"},{"title":"مراجع هذا الفصل","en":"References"}],"hq":1}},"order":[["المدخل","الخلاصة في دقائق",["intro"]],["الوحدة الأولى","المفاهيم والأسس العلمية",["p1","p2"]],["الوحدة الثانية","بناء المقياس خطوة بخطوة",["p3","rules12","methods","real","p11","p4"]],["الوحدة الثالثة","الإحصاء: الصدق والثبات والمعادلات",["p10","rel","p12","p13"]],["الوحدة الرابعة","المدارس والبحوث والدراسات",["p5","p6","p7","p8","p9"]],["المكتبة","المراجعة والملاحق والمسارد",["compare","p14","apx","gloss","sch","refs"]]],"bank":[{"q":"لماذا لا يكفي التحكيم النظري للبنود؟","a":"لأن الاستجابة الفعلية قد تكشف صعوبة أو تمييزًا أو فهمًا مختلفًا عما يتوقعه الخبير.","part":"p2"},{"q":"ما الفرق بين بند جيد إحصائيًا وبند صالح محتوى؟","a":"الجودة الإحصائية مرهونة بأداء العينة، بينما صدق التمثيل يتعلق بانتماء البند للنطاق المحدد وتغطيته.","part":"p2"},{"q":"ما أهمية اختيار عينة تقنين ممثلة؟","a":"حتى تحمل المقارنات المرجعية معنى مقبولًا للفئة التي ستُطبق عليها الأداة.","part":"p2"},{"q":"كيف تؤثر عينة التقنين؟","a":"تؤثر في التوزيع المرجعي وبالتالي معنى الدرجات النسبية وإمكان تعميمها.","part":"p2"},{"q":"ما المشكلة في بنود ذات مشتتات لا يختارها أحد؟","a":"قد لا تضيف قدرة تشخيصية أو تمييزية وتحتاج إلى تعديل.","part":"p2"},{"q":"لماذا اختيرت المجموعتان العليا والدنيا بدلًا من كل أفراد العينة؟","a":"لتكبير التباين بين فئتي الأداء وإظهار قدرة البند على الفصل، مع بقاء احتمال فقد معلومات الوسط وارتفاع حساسية النتيجة لتكوين العينة.","part":"p2"},{"q":"إذا كان معامل التمييز سالبًا، هل نحذف البند فورًا؟","a":"لا؛ يُراجع أولًا مفتاح التصحيح وصياغة البند واحتمال تفسيره بوجهين وتركيب العينة وغرض الاختبار.","part":"p2"},{"q":"هل البند الأصعب هو الأفضل دائمًا؟","a":"لا؛ تُختار درجات الصعوبة بما يخدم القدرة أو التحصيل المستهدف وحدود الفئة، وتُفحص قوة التمييز مع ملاءمة المحتوى.","part":"p2"},{"q":"متى تكون صعوبة البند المرتفعة ملائمة؟","a":"عندما يتناسب المستوى مع غرض الاختبار ومجتمع التطبيق والمجال المراد تمثيله.","part":"p2"},{"q":"لماذا لا تصح المقارنة المباشرة بين النسب الخام للصعوبة؟","a":"لأن تغير نسبة الصحيحة لا يلزم أن يمثل تغيرًا متساويًا في مستوى القدرة، ولأن شكل التوزيع وتكوين العينة يغيران معناه.","part":"p2"},{"q":"لماذا لا يكفي اختبار بدرجة ثبات عالية؟","a":"الثبات لا يحدد بمفرده ما يقيسه الاختبار ولا يبرر جميع قرارات تفسير الدرجة.","part":"p2"},{"q":"متى يكون التفسير المحكي أنسب؟","a":"حين نريد الحكم على إتقان مهارة أو مستوى أداء معرف مسبقًا، لا مجرد ترتيب الأفراد.","part":"p2"},{"q":"ما خطأ الاعتماد المطلق على اختبار معياري المرجع عند قياس الإتقان؟","a":"لأن الموقع النسبي بين الأفراد لا يساوي بالضرورة إثبات بلوغ مستوى محدد من المعرفة أو المهارة.","part":"p2"},{"q":"كيف يؤثر مستوى القطع في القرار؟","a":"لأنه يحوّل الدرجة إلى فئة اجتياز/عدم اجتياز، فتتغير أخطاء التصنيف بتغيره.","part":"p2"},{"q":"هل تتغير قيمة درجة القطع حسب القرار؟","a":"قد تختلف باختلاف تعريف الكفاية والخطأ المحتمل وعواقب التصنيف؛ ويلزم توثيق منهج الاختيار.","part":"p2"},{"q":"لماذا تحتاج طريقة أنجوف محكمين مدربين؟","a":"لأن تقدير أداء الفرد الحدّي يتطلب فهمًا مشتركًا للحد الأدنى من الكفاية والبنود.","part":"p2"},{"q":"هل درجة تقاطع المنحنيين تقضي على جميع أخطاء التصنيف؟","a":"لا؛ إنها اختيار لموضع حد بين مجموعتين ولا تمنع النتائج الإيجابية أو السلبية الخاطئة.","part":"p2"},{"q":"لماذا يُفضَّل الوسيط في طريقة المجموعة الحدية؟","a":"لأنه يمثل القيمة الوسطى لتوزيع درجات أفراد وصفهم الخبراء بأنهم على حد الإتقان.","part":"p2"},{"q":"هل وجود أسماء طرق متعددة يعني صلاحيتها بالتساوي؟","a":"لا؛ الاختيار يتوقف على الغرض وتوافر الخبراء والبيانات وحساسية القرار.","part":"p2"},{"q":"لماذا لا يكفي أن يتفق المحكمون على درجة قطع من دون الاطلاع على الأداء الواقعي؟","a":"لأن تقديرات الخبراء قد لا تعكس أداء الطلاب الفعلي وقد تنتج معيارًا متشددًا أو متساهلًا.","part":"p2"},{"q":"ما الفرق المفاهيمي بين K وV في الطريقة التوفيقية؟","a":"K حد أدنى مقبول لنسبة المفردات الصحيحة (الأداء المطلوب)، وV النسبة المتوقعة لاجتياز الطلاب.","part":"p2"},{"q":"كيف قد يتغير حد النجاح إذا تعارض الحد الأدنى للأداء مع النسبة المتوقعة للاجتياز؟","a":"تُجرى مواءمة بيانية توفيقية بينهما على توزيع الدرجات الفعلي؛ فالتشدد في الحد يخفض نسبة الناجحين والعكس.","part":"p2"},{"q":"كيف تُعرَّف المجموعة المتقنة وغير المتقنة بصورة مستقلة عن درجة الاختبار موضع الفحص؟","a":"بمحك خارجي (حكم معلمين/خبراء أو أداء مستقل)، وإلا صارت المقارنة دائرية.","part":"p2"},{"q":"لماذا يجب حساب أخطاء التصنيف عند المقارنة بين طرق القطع؟","a":"لأن القرار قد ينقل الطالب إلى فئة لا تنطبق عليه؛ فيلزم النظر في احتمال الخطأ وعواقبه.","part":"p2"},{"q":"هل يكفي أن تعتمد الطريقة على توزيع إحصائي لتصبح موضوعية تمامًا؟","a":"لا؛ جودة البيانات والافتراضات وتحديد مستوى الإتقان والتكاليف كلها تؤثر في النتائج.","part":"p2"},{"q":"ما الفرق بين الخطأ الأول والثاني؟","a":"صورتا الحكم الخاطئ المتعاكستان؛ يُستخدم التعريف المحدد لهما في نموذج الدراسة دون تبديل التسميات.","part":"p2"},{"q":"ما نقاط تقويم أي طريقة قطع قبل العمل بها؟","a":"صدق التصنيف، حساسية الطريقة للتعلم والاختبار، الملاءمة الإحصائية، أثر أخطاء القياس، التطبيق والحساب والتفسير والثقة العامة.","part":"p2"},{"q":"كيف يختلف الاختبار التشخيصي عن الاختبار المعياري للترتيب؟","a":"يتتبع المهارات الفرعية ومواضع التعثر اللازمة للعلاج، لا موقع الفرد بين أقرانه فقط.","part":"p2"},{"q":"لماذا لا يكفي تحديد عناوين الكفايات؟","a":"لأن المهارة العليا تتضمن مكونات سابقة يجب تفكيكها وترتيبها لتحديد ما ينبغي تشخيصه بدقة.","part":"p2"},{"q":"ما العناصر الأربعة للهدف السلوكي؟","a":"السلوك المتوقع، والمحتوى المرجعي، وشروط الأداء، ومستوى الأداء.","part":"p2"},{"q":"ما الفرق بين المفهوم والمبدأ؟","a":"المفهوم تصنيف قائم على خواص مشتركة، والمبدأ علاقة بين مفهومين أو أكثر.","part":"p2"},{"q":"لماذا يحتاج الفاحص إلى تدريب متخصص؟","a":"لأن إجراءات التطبيق والتصحيح والسرية وتفسير النتيجة قد تغير معنى الدرجة أو تسبب ضررًا عند إساءة الاستخدام.","part":"p2"},{"q":"ما الذي يفسد المقارنة بين نتائج فردين؟","a":"تفاوت ظروف التطبيق، أو التعليمات، أو اللغة، أو الخبرة السابقة، أو أثر الفاحص، ما لم تدخل في الاعتبار.","part":"p2"},{"q":"ما أثر خبرة أداء الاختبارات؟","a":"قد تعزز الدرجة دون تغير مكافئ في السمة الهدف، وتؤثر في صدق تفسير الفروق بين الأفراد.","part":"p2"},{"q":"لماذا يكون الاختبار غير الملائم خطرًا؟","a":"لأنه قد ينتج درجة تبدو موضوعية لكنها تعكس إعاقة حركية أو سوء ملاءمة لغوية أو عمرية لا السمة المستهدفة.","part":"p2"},{"q":"لماذا ينبغي ضبط التعليمات وموقف التطبيق؟","a":"لإقلال الفروق الخارجة عن السمة المقاسة، الناتجة عن تباين المعاملة والبيئة.","part":"p2"},{"q":"كيف يمكن تقليل تحيز التوقع في التصحيح؟","a":"بترميز أوراق المجموعات وإخفاء معلومات لا يحتاجها المصحح عندما يناسب ذلك تصميم الدراسة.","part":"p2"},{"q":"لماذا لا يُعد تدريب المفحوص قبل الاختبار إجراءً محايدًا دائمًا؟","a":"لأنه قد يغير ألفته بالمهمة ويؤثر في قابلية مقارنة درجاته بدرجات غير المدربين.","part":"p2"},{"q":"ما الفرق بين التهيئة والإيحاء بالإجابة؟","a":"التهيئة تشرح الغرض وتخفف غموض الموقف؛ الإيحاء يتدخل في عملية الاستجابة نفسها.","part":"p2"},{"q":"لماذا قد لا تكون الدرجة المنخفضة دليلًا قاطعًا على ضعف القدرة؟","a":"لأن القلق والتعب وفهم التعليمات وظروف المكان وسلوك الفاحص قد تسهم في النتيجة.","part":"p2"},{"q":"كيف يتعامل الباحث مع تفاوت الخبرة السابقة؟","a":"يوثق التدريب والخبرات ذات الصلة ويفحص أثرها أو يضبطها في تصميم المقارنة.","part":"p2"},{"q":"ما مقابل «صعوبة المفردة» في مقياس ليكرت؟","a":"متوسط العبارة أو معلم صعوبة التأييد في نموذج سلم التقدير؛ لا توجد إجابة صحيحة.","part":"p2"},{"q":"هل تُطبَّق معادلة تصحيح التخمين على مقياس اتجاهات؟","a":"لا؛ المقابل هو كشف الاستجابة العشوائية والموافقة المنهجية والمرغوبية الاجتماعية.","part":"p2"},{"q":"ما مقابل «تحليل المشتتات»؟","a":"تحليل أداء فئات الاستجابة وترتيب عتباتها.","part":"p2"},{"q":"هل يمكن استخدام صيغة (ع − د)/ن في مقياس؟","a":"نعم مع العبارات ثنائية الاستجابة؛ ومع ليكرت يُستخدم الفرق بين المتوسطين (t) أو الارتباط المصحح بالدرجة الكلية.","part":"p2"},{"q":"كيف تُحدَّد درجة قطع لمقياس اكتئاب مثلًا؟","a":"بطرق المجموعات المتضادة/الحدية بمحك تشخيصي مستقل (وحديثًا منحنى خصائص التشغيل)، مع الإبلاغ عن الحساسية والنوعية.","part":"p2"},{"q":"ما الفرق بين التقييم والتقويم؟","a":"التقييم (Assessment) جمع المعلومات وتفسيرها للوصف والتشخيص، والتقويم حكم قيمي في ضوء معايير يتبعه قرار علاج أو تطوير.","part":"p1"},{"q":"هل مقياس وكسلر مقياس أم اختبار؟","a":"اختبار رغم الاسم؛ لأنه يقيس أداءً أقصى بإجابات صحيحة.","part":"p1"},{"q":"ما الأداء الأقصى والأداء المعتاد؟","a":"تمييز كرونباخ: الأول أفضل ما يستطيعه الفرد (اختبارات)، والثاني ما يفعله عادة (مقاييس).","part":"p1"},{"q":"ما معاني كلمة المقياس؟","a":"مستوى القياس، وأداة القياس، وسلم الدرجات المشتقة.","part":"p1"},{"q":"ما الفرق بين الاستبيان والمقياس؟","a":"الاستبيان قد يجمع معلومات متفرقة بلا درجة كلية ولا سمة كامنة؛ المقياس عبارات متجانسة لسمة بدرجة لها صدق وثبات.","part":"p1"},{"q":"متى تصبح المقابلة أداة قياس؟","a":"إذا قُننت أسئلتها ووُضع لها دليل تقدير وحُسب اتفاق المقدّرين.","part":"p1"},{"q":"ما الفرق بين التوليد الاستنباطي والاستقرائي للعبارات؟","a":"الأول من النظرية والمقاييس السابقة، والثاني من مقابلات وأسئلة مفتوحة مع الفئة المستهدفة (هينكن، 1995).","part":"p3"},{"q":"كيف تحسب نسبة صدق المحتوى؟","a":"(ن الأساسية − ن/2) ÷ (ن/2)؛ والقيمة الحرجة تتغير بعدد المحكمين.","part":"p10"},{"q":"لماذا لا يكفي محك الجذر الكامن > 1؟","a":"لأنه يبالغ غالبًا في عدد العوامل؛ والتحليل الموازي (هورن، 1965) أدق. ← 3.2 (الخطوة 10)","part":"p3"},{"q":"لماذا نفصل عينة الاستكشاف عن عينة التوكيد؟","a":"لأن التوكيد على العينة نفسها يرفع المطابقة زيفًا.","part":"p3"},{"q":"لماذا تُفضَّل أوميغا على ألفا؟","a":"لأن ألفا تفترض تساوي التشبعات.","part":"p10"},{"q":"ما المقابلات المعرفية؟","a":"تطبيق العبارات مع التفكير بصوت عالٍ لكشف سوء الفهم (ويليس، 2005). ← 3.2 (الخطوة 8)","part":"p3"},{"q":"ما خطوات التكييف الثقافي لمقياس أجنبي؟","a":"ترجمة أمامية، توليف، ترجمة عكسية، لجنة خبراء، تجريب، توثيق (بيتون وآخرون، 2000)، ثم التحقق من التكافؤ. ← 3.2 (الخطوة 12)","part":"p3"},{"q":"ما الفرق بين خداع الذات وإدارة الانطباع؟","a":"الأول لا واعٍ (يصدّق الفرد صورته الإيجابية)، والثاني واعٍ ومقصود (باولهس، 1984). ← 4.1، 7.2","part":"p4"},{"q":"هل ضبط المرغوبية إحصائيًا يحسن الصدق دائمًا؟","a":"لا؛ قد يحذف تباينًا حقيقيًا (ماكري وكوستا 1983؛ أونز وآخرون 1996؛ أوزييل 2010).","part":"p4"},{"q":"هل العبارات السالبة حل لمشكلة الموافقة المنهجية؟","a":"تساعد لكنها قد تخفض الثبات وتخلق عاملًا منهجيًا؛ تُستخدم بحذر وتُفحص.","part":"p4"},{"q":"ما تحيز الطريقة المشتركة وكيف تحد منه؟","a":"تباين مصدره الأداة الواحدة؛ يُحد منه بمصادر متعددة وفصل زمني وعامل طريقة في التحليل العاملي التوكيدي.","part":"p4"},{"q":"ما الفرق بين الأداء التفاضلي والتحيز؟","a":"الأداء التفاضلي إشارة إحصائية، والتحيز حكم يحتاج تفسيرًا محتوائيًا.","part":"p4"},{"q":"ما التعمية في التصحيح ومن أين جاءت في المادة؟","a":"إخفاء معلومات المجموعات عن المصححين وخلط الأوراق بترميز مستقل (الكتاب ص 148–149).","part":"p4"},{"q":"ما الفرق بين البنائية والبنيوية؟","a":"البنائية نظرية تعلم (بياجيه وفيجوتسكي)، والبنيوية مدرسة تحليل الشعور إلى عناصر (فونت وتيتشنر).","part":"p5"},{"q":"ما منطقة النمو القريبة؟","a":"المسافة بين ما يستطيعه المتعلم وحده وما يستطيعه بمساعدة (فيجوتسكي).","part":"p5"},{"q":"ما التقييم الدينامي؟","a":"اختبار ← تدخل ← إعادة اختبار لقياس قابلية التعلم (فويرشتاين).","part":"p5"},{"q":"ما أبعاد مسح بيئة التعلم البنائية؟","a":"الصلة الشخصية، عدم اليقين، الصوت الناقد، المشاركة في التحكم، تفاوض الطلاب.","part":"p5"},{"q":"ما نقد كيرشنر وزملائه للبنائية؟","a":"التعليم قليل التوجيه أقل فاعلية للمبتدئين بسبب حدود الذاكرة العاملة والحمل المعرفي.","part":"p5"},{"q":"ما موقفك من البنائية في القياس؟","a":"تكاملي: تحدد «ماذا» نقيس، والقياس الموضوعي يحدد «كيف» نقيسه بعدالة.","part":"p5"},{"q":"كم عدد مفردات مقياس الاتزان الانفعالي قبل الحذف وبعده؟","a":"19","part":"p7"},{"q":"ما المفردات المتحيزة ولصالح من؟","a":"10 و12 للذكور، و16 للإناث.","part":"p7"},{"q":"ما قيم الثبات في بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»؟","a":"ثبات الأفراد 0.89 (فصل 2.91)، والمفردات 0.98 (فصل 7.07).","part":"p7"},{"q":"كيف تحقق البحث من أحادية البعد؟","a":"تحليل عاملي استكشافي: مؤشر كايزر–ماير–أولكن = 0.934، جذر أول 6.705 (35.29%)، نسبة الجذرين 5.07.","part":"p7"},{"q":"ما قيمة ارتباط المرغوبية بالذكاء العاطفي؟","a":"r = 0.427 دال عند 0.01 لدى 755 طالبًا.","part":"p7"},{"q":"كم عبارة بقيت في قائمة باولهس المتوازنة للاستجابة المرغوبة اجتماعيًا العربي؟","a":"26 (12 خداع ذات + 14 إدارة انطباع) من 40.","part":"p7"},{"q":"ما أهم ملاحظة نقدية على بحث «المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي»؟","a":"انخفاض مؤشر المطابقة المقارن (0.688) ومؤشر توكر–لويس (0.659) عن المحكات، وعدم حسم «التلوث أم الجوهر».","part":"p7"},{"q":"ما أهم ملاحظة نقدية على بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»؟","a":"غياب حجم أثر الأداء التفاضلي وتصحيح تعدد الاختبارات، وعدم ذكر عدد الذكور والإناث.","part":"p7"},{"q":"ما معادلة سبيرمان–براون وقيمتها إذا كان ارتباط النصفين 0.70؟","a":"2r/(1+r) = 0.824.","part":"p10"},{"q":"ما تصنيف هيئة خدمات الاختبارات التربوية لدلتا مانتل–هانزل = −1.10؟","a":"فئة B (متوسط).","part":"p10"},{"part":"rules12","q":"ما الفرق بين التعريف النظري والتعريف الإجرائي للسمة؟","a":"النظري يحدد حدود السمة ومعناها، والإجرائي يحددها بمؤشرات قابلة للقياس على المقياس."},{"part":"rules12","q":"لماذا نكتب عبارات أكثر من المطلوب؟","a":"لأن جزءًا كبيرًا منها يُحذف في التحكيم والتحليل الإحصائي."},{"part":"rules12","q":"ما وظيفة جدول المواصفات؟","a":"توزيع العبارات على الأبعاد بحسب أوزانها لضمان تمثيل السمة تمثيلًا متوازنًا."},{"part":"rel","q":"متى نستخدم KR‑20 بدل ألفا؟","a":"عندما تكون الفقرات ثنائية الدرجة (صح/خطأ أو نعم/لا)."},{"part":"rel","q":"متى نستخدم معادلة جتمان بدل سبيرمان–براون؟","a":"عند عدم تساوي تبايني نصفي الاختبار."},{"part":"rel","q":"ماذا يقيس الخطأ المعياري للقياس؟","a":"مقدار التذبذب المتوقع حول الدرجة الملاحظة للفرد، ويُستخدم لبناء فترة ثقة لها."}],"glossary":[{"ar":"القياس","en":"Measurement","d":"تعيين أعداد للأشياء أو الأحداث وفق قواعد"},{"ar":"المقياس","en":"Scale / Inventory","d":"أداة من عبارات متجانسة لقياس سمة بأداء معتاد"},{"ar":"الاختبار","en":"Test","d":"أداة مقننة لقياس أداء أقصى بصواب وخطأ"},{"ar":"التقييم","en":"Assessment","d":"جمع المعلومات وتفسيرها للوصف والتشخيص"},{"ar":"التقويم","en":"Evaluation","d":"حكم قيمي في ضوء معايير يتبعه قرار"},{"ar":"التقويم التكويني","en":"Formative Evaluation","d":"تقويم أثناء التعلم لتحسينه"},{"ar":"التقويم الختامي","en":"Summative Evaluation","d":"تقويم في النهاية للحكم على الناتج"},{"ar":"مستويات القياس","en":"Levels of Measurement","d":"اسمي، رتبي، فئوي، نسبي (ستيفنز)"},{"ar":"السمة / البناء الكامن","en":"Construct / Latent Trait","d":"مفهوم نظري لا يُلاحظ مباشرة"},{"ar":"التعريف الإجرائي","en":"Operational Definition","d":"تعريف السمة بالإجراءات أو الدرجة التي تقيسها"},{"ar":"الأداء الأقصى","en":"Maximal Performance","d":"أفضل ما يستطيعه الفرد"},{"ar":"الأداء المعتاد","en":"Typical Performance","d":"ما يفعله الفرد أو يشعر به عادة"},{"ar":"جدول المواصفات","en":"Table of Specifications / Blueprint","d":"توزيع العبارات على الأبعاد والأوزان"},{"ar":"مجمّع العبارات","en":"Item Pool","d":"المجموعة الأولية الكبيرة من العبارات"},{"ar":"العبارة السالبة / المعكوسة","en":"Reverse-Keyed Item","d":"عبارة يُعكس تصحيحها"},{"ar":"تدريج ليكرت","en":"Likert Scale","d":"تدريج موافقة تُجمع درجاته"},{"ar":"التمايز الدلالي","en":"Semantic Differential","d":"أزواج صفات متضادة (أوسجود)"},{"ar":"المقياس التراكمي","en":"Guttman Scale","d":"عبارات مرتبة تراكميًا (جتمان)"},{"ar":"الفترات المتساوية الظهور","en":"Equal-Appearing Intervals","d":"طريقة ثرستون لتدريج الاتجاهات"},{"ar":"الصدق","en":"Validity","d":"صحة تفسير الدرجة واستخدامها"},{"ar":"صدق المحتوى","en":"Content Validity","d":"تمثيل العبارات لمجال السمة"},{"ar":"الصدق الظاهري","en":"Face Validity","d":"ما يبدو أن الأداة تقيسه"},{"ar":"صدق البناء","en":"Construct Validity","d":"مدى قياس الأداة للبناء النظري"},{"ar":"الصدق التقاربي","en":"Convergent Validity","d":"ارتباط بمقاييس لنفس السمة"},{"ar":"الصدق التمييزي","en":"Discriminant Validity","d":"ضعف الارتباط بسمات مختلفة"},{"ar":"الصدق المحكي","en":"Criterion Validity","d":"ارتباط الدرجة بمحك خارجي"},{"ar":"الصدق التنبؤي","en":"Predictive Validity","d":"التنبؤ بمحك مستقبلي"},{"ar":"صدق المجموعات المتضادة","en":"Known-Groups Validity","d":"التمييز بين مجموعات معروفة الاختلاف"},{"ar":"صدق العواقب","en":"Consequential Validity","d":"آثار استخدام الدرجات (ميسيك)"},{"ar":"الشبكة النوموثيتية","en":"Nomological Network","d":"شبكة العلاقات النظرية للبناء (كرونباخ وميل)"},{"ar":"نسبة صدق المحتوى","en":"Content Validity Ratio (CVR)","d":"مؤشر لوشي لاتفاق المحكمين"},{"ar":"مؤشر صدق المحتوى","en":"Content Validity Index (CVI)","d":"متوسط صلاحية العبارات"},{"ar":"الثبات","en":"Reliability","d":"اتساق الدرجات أو القرارات"},{"ar":"الاتساق الداخلي","en":"Internal Consistency","d":"تجانس العبارات"},{"ar":"معامل ألفا","en":"Cronbach's Alpha","d":"مؤشر الاتساق الداخلي"},{"ar":"معامل أوميغا","en":"McDonald's Omega","d":"مؤشر ثبات لا يفترض تساوي التشبعات"},{"ar":"التجزئة النصفية","en":"Split-Half Reliability","d":"ارتباط نصفي المقياس"},{"ar":"معادلة سبيرمان–براون","en":"Spearman–Brown Formula","d":"تصحيح طول المقياس"},{"ar":"ثبات إعادة التطبيق","en":"Test–Retest Reliability","d":"استقرار الدرجات عبر الزمن"},{"ar":"اتفاق المقدّرين","en":"Inter-Rater Reliability","d":"اتفاق الملاحظين أو المصححين"},{"ar":"معامل كابا","en":"Cohen's Kappa","d":"اتفاق مصحح عن الصدفة"},{"ar":"الخطأ المعياري للقياس","en":"Standard Error of Measurement","d":"هامش الخطأ حول درجة الفرد"},{"ar":"اتساق القرار","en":"Decision Consistency","d":"است
